[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "locallink"
version = "0.1.0"
description = "Offline-first, decentralized P2P messaging with asynchronous Matrix sync."
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "LocalLink Contributors"}]
requires-python = ">=3.10"
keywords = ["p2p", "messaging", "offline-first", "mesh", "matrix", "mdns", "zeroconf"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Chat",
]
dependencies = [
    "peewee>=4.0",
    "zeroconf>=0.130",
    "requests>=2.31",
    "textual>=0.60",
    "PyNaCl>=1.5",
    "Flask>=3.0",
]

[project.optional-dependencies]
dev = [
    "pyyaml",
]

[project.scripts]
locallink = "run:main"

[project.urls]
Homepage = "https://m7md2323.github.io/LinkLocal"
Repository = "https://github.com/m7md2323/LinkLocal"

[tool.setuptools]
packages = [
    "engine",
    "engine.mesh",
    "engine.network",
    "engine.security",
    "engine.storage",
    "cli",
    "bridge",
]
include-package-data = false

# Manually listed because setuptools auto-discovery would pick up
# `tests/`, `docs/`, `docs/index.html`, `install.sh`, etc. We keep the
# install lean.
